esphome:
  name: aquaforte-poolheater

esp32:
  variant: esp32s3
  framework:
    type: esp-idf



external_components:
  - source: github://pr#14455
    components: [climate, template]


# -----------------------------
# Logging
# -----------------------------
logger:
  level: DEBUG

debug:

# -----------------------------
# WiFi + API + OTA
# -----------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Heatpump Fallback"
    password: !secret wifi_fallback_password

captive_portal:

api:
  encryption:
    key: !secret API_key

ota:
  - platform: esphome
    password: !secret OTA_Password

time:
  - platform: homeassistant
    id: esptime

globals:
  - id: hp_cop_factor
    type: float
    initial_value: '300.0'
  - id: hp_flow_m3h
    type: float
    initial_value: '5.9' #Define here your global flow-rate during normal operation, not during backwash/rinse. In m³/h (cubic meters/hour)  
  - id: hp_cop_filtered
    type: float
    initial_value: '0'



# -----------------------------
# UART (your RS485)
# -----------------------------
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 9600
  data_bits: 8
  stop_bits: 1
  parity: NONE
  flow_control_pin: GPIO21
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      delimiter: "\n"
    sequence:
      - lambda: UARTDebug::log_string(direction, bytes);
# The code for RS485 towards the heatpump is based on: https://github.com/rstcologne/ESP-Home-Fairland-Heatpump/blob/main/config/esphome_snippet.yaml

# -----------------------------
# Modbus
# -----------------------------
modbus:
  id: modbus1
  uart_id: uart_bus
  send_wait_time: 500ms

modbus_controller:
  # 4x / coil blok
  - id: aquaforte_holding
    address: 0x01
    modbus_id: modbus1
    update_interval: 30s
    command_throttle: 400ms

  # 3x blok 0..7
  - id: aquaforte_3x_0_7
    address: 0x01
    modbus_id: modbus1
    update_interval: 33s
    command_throttle: 400ms

  # 3x blok 8..14
  - id: aquaforte_3x_8_14
    address: 0x01
    modbus_id: modbus1
    update_interval: 36s
    command_throttle: 400ms

  # 3x blok 29..30
  - id: aquaforte_3x_29_30
    address: 0x01
    modbus_id: modbus1
    update_interval: 39s
    command_throttle: 400ms

  # 1x foutblok 48..55
  - id: aquaforte_1x_errors
    address: 0x01
    modbus_id: modbus1
    update_interval: 43s
    command_throttle: 400ms

# ----------------------------------------------------
# 0x COIL - POWER
# ----------------------------------------------------

switch:
  - platform: modbus_controller
    modbus_controller_id: aquaforte_holding
    name: "HP Power"
    id: hp_power
    register_type: coil
    address: 0

# ----------------------------------------------------
# 4x HOLDING REGISTERS (MODE, FAN, SETPOINTS)
# ----------------------------------------------------

select:
  - platform: modbus_controller
    name: "HP Function Mode"
    id: hp_function_mode
    modbus_controller_id: aquaforte_holding
    address: 0
    value_type: U_WORD
    optionsmap:
      "Auto": 0
      "Heating": 1
      "Cooling": 2

  - platform: modbus_controller
    name: "HP Fan Mode"
    id: hp_fan_mode
    modbus_controller_id: aquaforte_holding
    address: 1
    value_type: U_WORD
    optionsmap:
      "Smart": 0
      "Silence": 1
      "Turbo": 2

number:
  - platform: modbus_controller
    modbus_controller_id: aquaforte_holding
    name: "HP Auto Setpoint"
    id: hp_auto_setpoint
    register_type: holding
    address: 2
    value_type: U_WORD
    unit_of_measurement: "°C"
    min_value: 12
    max_value: 40
    step: 0.5
    lambda: |-
      return (x - 60) / 2.0;
    write_lambda: |-
      return x * 2.0 + 60.0;

  - platform: modbus_controller
    modbus_controller_id: aquaforte_holding
    name: "HP Heating Setpoint"
    id: hp_heating_setpoint
    register_type: holding
    address: 3
    value_type: U_WORD
    unit_of_measurement: "°C"
    min_value: 18
    max_value: 40
    step: 0.5
    lambda: |-
      return (x - 60) / 2.0;
    write_lambda: |-
      return x * 2.0 + 60.0;

  - platform: modbus_controller
    modbus_controller_id: aquaforte_holding
    name: "HP Cooling Setpoint"
    id: hp_cooling_setpoint
    register_type: holding
    address: 4
    value_type: U_WORD
    unit_of_measurement: "°C"
    min_value: 12
    max_value: 30
    step: 0.5
    lambda: |-
      return (x - 60) / 2.0;
    write_lambda: |-
      return x * 2.0 + 60.0;

# ----------------------------------------------------
# 3x INPUT REGISTERS (READ ONLY)
# Split in 3 controllers so read-ranges don't overlap and avoids timing-issues as the controller can not always follow on load:
#   0..7
#   8..14
#   29..30
# This avoids the ESPhome tries to read in one big read for more than 8 registers which is not supported or starts behaving weird. 
# ESPHome groups ranges automatic for addresses following next to it. 【1-4c87a2】【2-327c19】
# ----------------------------------------------------

sensor:
  # ---------- blok 3x 0..7 ----------
  - platform: modbus_controller
    modbus_controller_id: aquaforte_3x_0_7
    name: "HP Compressor %"
    id: hp_comp_percent
    register_type: read
    address: 0
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: aquaforte_3x_0_7
    name: "HP Target Frequency"
    id: hp_target_freq
    register_type: read
    address: 1
    value_type: U_WORD
    unit_of_measurement: "Hz"

  - platform: modbus_controller
    modbus_controller_id: aquaforte_3x_0_7
    name: "HP PFC Voltage"
    id: hp_pfc_voltage
    register_type: read
    address: 2
    value_type: U_WORD
    unit_of_measurement: "V"

  - platform: modbus_controller
    modbus_controller_id: aquaforte_3x_0_7
    name: "HP Inlet Temp"
    id: hp_inlet
    register_type: read
    address: 3
    value_type: U_WORD
    lambda: |-
      return (x - 60) / 2.0;
    unit_of_measurement: "°C"

  - platform: modbus_controller
    modbus_controller_id: aquaforte_3x_0_7
    name: "HP Outlet Temp"
    id: hp_outlet
    register_type: read
    address: 4
    value_type: U_WORD
    lambda: |-
      return (x - 60) / 2.0;
    unit_of_measurement: "°C"

  - platform: modbus_controller
    modbus_controller_id: aquaforte_3x_0_7
    name: "HP Ambient Temp"
    id: hp_ambient
    register_type: read
    address: 5
    value_type: U_WORD
    lambda: |-
      return (x - 60) / 2.0;
    unit_of_measurement: "°C"

  - platform: modbus_controller
    modbus_controller_id: aquaforte_3x_0_7
    name: "HP Exhaust Temp"
    id: hp_exhaust
    register_type: read
    address: 6
    value_type: U_WORD
    lambda: |-
      return x / 2.0;
    unit_of_measurement: "°C"

  - platform: modbus_controller
    modbus_controller_id: aquaforte_3x_0_7
    name: "HP Outer Coil Temp"
    id: hp_outer_coil
    register_type: read
    address: 7
    value_type: U_WORD
    lambda: |-
      return (x - 60) / 2.0;
    unit_of_measurement: "°C"

  # ---------- blok 3x 8..14 ----------
  - platform: modbus_controller
    modbus_controller_id: aquaforte_3x_8_14
    name: "HP Gas Return Temp"
    id: hp_gas_return
    register_type: read
    address: 8
    value_type: U_WORD
    lambda: |-
      return (x - 60) / 2.0;
    unit_of_measurement: "°C"

  - platform: modbus_controller
    modbus_controller_id: aquaforte_3x_8_14
    name: "HP Inner Coil Temp"
    id: hp_inner_coil
    register_type: read
    address: 9
    value_type: U_WORD
    lambda: |-
      return (x - 60) / 2.0;
    unit_of_measurement: "°C"

  - platform: modbus_controller
    modbus_controller_id: aquaforte_3x_8_14
    name: "HP Compressor Frequency"
    id: hp_comp_freq
    register_type: read
    address: 10
    value_type: U_WORD
    unit_of_measurement: "Hz"

  - platform: modbus_controller
    modbus_controller_id: aquaforte_3x_8_14
    name: "HP Compressor Current"
    id: hp_comp_current
    register_type: read
    address: 11
    value_type: U_WORD
    lambda: |-
      return x / 10.0;
    unit_of_measurement: "A"

  - platform: modbus_controller
    modbus_controller_id: aquaforte_3x_8_14
    name: "HP Cooling Plate Temp"
    id: hp_cooling_plate
    register_type: read
    address: 12
    value_type: U_WORD
    lambda: |-
      return x / 2.0;
    unit_of_measurement: "°C"

  - platform: modbus_controller
    modbus_controller_id: aquaforte_3x_8_14
    name: "HP Expansion Valve"
    id: hp_eev
    register_type: read
    address: 13
    value_type: U_WORD
    unit_of_measurement: "steps"

  - platform: modbus_controller
    modbus_controller_id: aquaforte_3x_8_14
    name: "HP Fan RPM"
    id: hp_fan_rpm
    register_type: read
    address: 14
    value_type: U_WORD
    unit_of_measurement: "RPM"

  # ---------- blok 3x 29..30 ----------
  - platform: modbus_controller
    modbus_controller_id: aquaforte_3x_29_30
    name: "HP Input Power"
    id: hp_input_power
    register_type: read
    address: 29
    value_type: U_WORD
    unit_of_measurement: "W"

  - platform: modbus_controller
    modbus_controller_id: aquaforte_3x_29_30
    name: "HP Working Voltage"
    id: hp_working_voltage
    register_type: read
    address: 30
    value_type: U_WORD
    unit_of_measurement: "V"

  # ---------- templates ----------
  - platform: template
    name: "HP Input Power kW"
    id: hp_input_power_kw
    unit_of_measurement: "kW"
    accuracy_decimals: 2
    lambda: |-
      if (isnan(id(hp_input_power).state)) return NAN;
      return id(hp_input_power).state / 1000.0;

  - platform: template
    name: "HP Delta T"
    id: hp_delta_t
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    lambda: |-
      if (isnan(id(hp_inlet).state) || isnan(id(hp_outlet).state)) return NAN;
      return id(hp_outlet).state - id(hp_inlet).state;

  - platform: template
    name: "HP Heat Output"
    id: hp_heat_output
    unit_of_measurement: "W"
    accuracy_decimals: 0
    state_class: measurement
    lambda: |-
      if (isnan(id(hp_delta_t).state)) return NAN;

      float dt = id(hp_delta_t).state;
      float flow = id(hp_flow_m3h);

      return 1163.0f * flow * dt;

    #physical constant 1163.0 of water (shortened formula)

  - platform: template
    name: "HP COP"
    id: hp_cop
    accuracy_decimals: 2
    state_class: measurement
    lambda: |-
      float p_in = id(hp_input_power).state;   // W
      float q_out = id(hp_heat_output).state;  // W

      if (p_in < 50 || isnan(q_out)) return NAN;

      float cop_raw = q_out / p_in;

      // sanity guard
      if (cop_raw < 0.0f || cop_raw > 20.0f) return NAN;

      // exponential smoothing
      float alpha = 0.2f;

      if (id(hp_cop_filtered) <= 0.0f || isnan(id(hp_cop_filtered))) {
        id(hp_cop_filtered) = cop_raw;
      } else {
        id(hp_cop_filtered) =
          alpha * cop_raw + (1.0f - alpha) * id(hp_cop_filtered);
      }

      return roundf(id(hp_cop_filtered) * 100.0f) / 100.0f;

  
  # Needed to have this sensor so it can be added to the energy-consumption tracking
  - platform: total_daily_energy
    name: "HP Daily Energy"
    power_id: hp_input_power_kw
    unit_of_measurement: "kWh"  
  

  - platform: integration
    name: "HP Total Energy"
    sensor: hp_input_power_kw
    time_unit: h
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing



# -----------------------------
# Controller Sensors of ESP32 itself (long-term stats in HA)
# -----------------------------
  - platform: uptime
    name: "Controller Uptime"

  - platform: internal_temperature
    name: "Controller Internal Temperature"
    device_class: temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 60s

  - platform: wifi_signal
    name: "Controller WiFi Signal"
    device_class: signal_strength
    unit_of_measurement: "dBm"
    accuracy_decimals: 0
    update_interval: 60s



# ----------------------------------------------------
# 1x ERROR DECODER
# 48..55 stays legally in 1 block; 1x reads according to documentation should start from address 48. 
# ----------------------------------------------------

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: aquaforte_1x_errors
    name: "HP Error E0 High Pressure"
    id: hp_error_e0
    register_type: discrete_input
    address: 48

  - platform: modbus_controller
    modbus_controller_id: aquaforte_1x_errors
    name: "HP Error E1 Low Pressure"
    id: hp_error_e1
    register_type: discrete_input
    address: 49

  - platform: modbus_controller
    modbus_controller_id: aquaforte_1x_errors
    name: "HP Error E2 Water Flow"
    id: hp_error_e2
    register_type: discrete_input
    address: 50

  - platform: modbus_controller
    modbus_controller_id: aquaforte_1x_errors
    name: "HP Error E3 Ambient Sensor"
    id: hp_error_e3
    register_type: discrete_input
    address: 51

  - platform: modbus_controller
    modbus_controller_id: aquaforte_1x_errors
    name: "HP Error E4 Coil Sensor"
    id: hp_error_e4
    register_type: discrete_input
    address: 52

  - platform: modbus_controller
    modbus_controller_id: aquaforte_1x_errors
    name: "HP Error E5 Exhaust Sensor"
    id: hp_error_e5
    register_type: discrete_input
    address: 53

  - platform: modbus_controller
    modbus_controller_id: aquaforte_1x_errors
    name: "HP Error E6 Return Gas Sensor"
    id: hp_error_e6
    register_type: discrete_input
    address: 54

  - platform: modbus_controller
    modbus_controller_id: aquaforte_1x_errors
    name: "HP Error E7 Plate Sensor"
    id: hp_error_e7
    register_type: discrete_input
    address: 55

text_sensor:
  - platform: template
    name: "HP Error Summary"
    id: hp_error_summary
    lambda: |-
      std::string msg = "";
      if (id(hp_error_e0).state) msg += "E0 High Pressure; ";
      if (id(hp_error_e1).state) msg += "E1 Low Pressure; ";
      if (id(hp_error_e2).state) msg += "E2 Water Flow; ";
      if (id(hp_error_e3).state) msg += "E3 Ambient Sensor; ";
      if (id(hp_error_e4).state) msg += "E4 Coil Sensor; ";
      if (id(hp_error_e5).state) msg += "E5 Exhaust Sensor; ";
      if (id(hp_error_e6).state) msg += "E6 Return Gas Sensor; ";
      if (id(hp_error_e7).state) msg += "E7 Plate Sensor; ";
      if (msg.empty()) msg = "No errors";
      return msg;
# -----------------------------
# Controller Text-Sensors of ESP32 itself (long-term stats in HA)
# -----------------------------
  - platform: debug
    device:
      name: "Controller Reset Reason"
      entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "Controller IP Address"
      entity_category: diagnostic

    mac_address:
      name: "Controller MAC Address"
      entity_category: diagnostic

    ssid:
      name: "Controller WiFi SSID"
      entity_category: diagnostic

climate:
  - platform: template
    name: "Aquaforte Heatpump"
    id: aquaforte_climate

    # UI: current temperature
    current_temperature: !lambda "return id(hp_inlet).state;"
    
    visual:
      temperature_step: 0.5
      min_temperature: 12
      max_temperature: 40


    # ✅ Mode mapping (from the climate-entity select → climate mode)
    mode: !lambda |-
      if (!id(hp_power).state) {
        return climate::CLIMATE_MODE_OFF;
      }

      auto m = id(hp_function_mode).current_option();

      if (m == "Heating") return climate::CLIMATE_MODE_HEAT;
      if (m == "Cooling") return climate::CLIMATE_MODE_COOL;

      return climate::CLIMATE_MODE_HEAT;  // fallback

    # ✅ Setpoint mapping (depending on mode)
    target_temperature: !lambda |-
      auto m = id(hp_function_mode).current_option();

      if (m == "Cooling") return id(hp_cooling_setpoint).state;
      if (m == "Auto") return id(hp_auto_setpoint).state;

      return id(hp_heating_setpoint).state;

    # ✅ available modes in Home Assistant
    supported_modes:
      - "OFF"
      - HEAT
      - COOL

    # ✅ what should happen when user adapts mode in the UI.
    set_mode_action:
    - lambda: |-
        if (x == climate::CLIMATE_MODE_OFF) {
          id(hp_power).turn_off();
          return;
        }

        id(hp_power).turn_on();

        auto call_mode = id(hp_function_mode).make_call();

        if (x == climate::CLIMATE_MODE_HEAT) {
          call_mode.set_option("Heating");
        } else if (x == climate::CLIMATE_MODE_COOL) {
          call_mode.set_option("Cooling");
        }

        call_mode.perform();
    
    # ✅ add read-delay when writing so it doesn't conflict
    - delay: 250ms

    # ✅ force a refresh after the delay, so the UI-climate-entity reflects it.
    - component.update: aquaforte_holding


    # ✅ what should happen when the climate-temperature is adapted.
    set_target_temperature_action:
      - lambda: |-
          auto m = id(hp_function_mode).current_option();

          if (m == "Cooling") {
            auto call = id(hp_cooling_setpoint).make_call();
            call.set_value(x);
            call.perform();
            return;
          }

          if (m == "Auto") {
            auto call = id(hp_auto_setpoint).make_call();
            call.set_value(x);
            call.perform();
            return;
          }

          auto call = id(hp_heating_setpoint).make_call();
          call.set_value(x);
          call.perform();
      # ✅ add delay after write before reading it again, controller needs some time to register it.
      - delay: 250ms

      # ✅ after delay do a refresh
      - component.update: aquaforte_holding

    optimistic: false
